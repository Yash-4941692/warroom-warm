name: warm-ping
on:
  workflow_dispatch:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"   # backup kick-starters (in case a chain ever dies)
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: warm-daemon
        env:
          WARM_TOKEN: ${{ secrets.WARM_TOKEN }}
          SELF: ${{ github.run_id }}
        run: |
          set -u
          API=https://api.github.com/repos/Yash-4941692/warroom-warm
          URL=https://jee-war-room-three.vercel.app/healthz?detail=1
          do_ping(){
            for t in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
              echo "$(date -u +%H:%M:%S) ping -> HTTP ${code:-000}"
              [ "$code" = "200" ] && return 0
              sleep 15
            done
          }
          others(){
            curl -s -H "Authorization: token $WARM_TOKEN" "$API/actions/runs?status=in_progress" \
              | python3 -c "import sys,os,json;print(sum(1 for r in json.load(sys.stdin)['workflow_runs'] if r['name']=='warm-ping' and str(r['id'])!=os.environ['SELF']))"
          }
          # Wait for any older daemon to finish (handoff overlap is ~2 min).
          for w in $(seq 1 8); do
            do_ping
            n=$(others); echo "other daemons running: $n"
            [ "$n" = "0" ] && break
            [ "$w" = "8" ] && { echo "another daemon is active; exiting as duplicate"; exit 0; }
            sleep 45
          done
          # Prove the token + dispatch work from inside the runner (spawns a duplicate that exits).
          curl -s -o /dev/null -X POST -H "Authorization: token $WARM_TOKEN" \
            "$API/actions/workflows/ping.yml/dispatches" -d '{"ref":"main"}' \
            -w "startup self-check dispatch -> HTTP %{http_code}\n"
          # Primary daemon: ping every 5 minutes for ~4h40m, then hand off and exit.
          for i in $(seq 1 56); do
            do_ping
            if [ "$i" -eq 56 ]; then
              curl -s -o /dev/null -X POST -H "Authorization: token $WARM_TOKEN" \
                "$API/actions/workflows/ping.yml/dispatches" -d '{"ref":"main"}' \
                -w "handoff dispatch -> HTTP %{http_code}\n"
              echo "handoff complete; exiting"
              exit 0
            fi
            sleep 300
          done
